# Render.com blueprint for the backend API.
# The database and file storage are external (e.g. Supabase) — set the env vars
# in the Render dashboard or below.
services:
  - type: web
    name: dataroom-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # e.g. https://your-frontend.vercel.app
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: eu-central-1
      - key: S3_BUCKET
        value: dataroom
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
